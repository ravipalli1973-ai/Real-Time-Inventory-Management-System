
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Inventory Management System</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/add">Add Product</a>
        <a href="/products">View Products</a>
    </nav>
</header>

<div class="form-container">

    <h2>Edit Product</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div role="alert"
                     style="padding:12px; margin-bottom:15px; border-radius:5px;
                     color:{% if category == 'error' %}#b91c1c{% else %}#166534{% endif %};
                     background:{% if category == 'error' %}#fee2e2{% else %}#dcfce7{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Product Name</label>
        <input type="text" name="product_name"
               value="{{ product.product_name }}" required>

        <label>Category</label>
        <input type="text" name="category"
               value="{{ product.category }}" required>

        <label>Price (₹)</label>
        <input type="number" step="0.001" min="0.001"
               name="price" value="{{ product.price }}" required>

        <label>Quantity</label>
        <input type="number" min="0" step="1"
               name="quantity" value="{{ product.quantity }}" required>

        <label>Supplier</label>
        <input type="text" name="supplier"
               value="{{ product.supplier }}" required>

        <button type="submit">Update Product</button>

    </form>

</div>

</body>
</html>
