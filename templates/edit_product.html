<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Inventory Management System</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/add">Add Product</a>
        <a href="/products">View Products</a>
    </nav>
</header>

<div class="form-container">

    <h2 style="margin-bottom: 20px;">Edit Product</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div role="alert"
                     style="padding:12px; margin-bottom:15px; border-radius:5px;
                     color:{% if category == 'error' %}#b91c1c{% else %}#166534{% endif %};
                     background:{% if category == 'error' %}#fee2e2{% else %}#dcfce7{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label for="product_name">Product Name</label>
        <input type="text" id="product_name" name="product_name"
               value="{{ product.product_name }}" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category"
               value="{{ product.category }}" required>

        <label for="price">Price (₹)</label>
        <input type="number" id="price" step="0.001" min="0.001"
               name="price" value="{{ product.price }}" required>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="0" step="1"
               name="quantity" value="{{ product.quantity }}" required>

        <label for="supplier">Supplier</label>
        <input type="text" id="supplier" name="supplier"
               value="{{ product.supplier }}" required>

        <div style="display: flex; gap: 10px; align-items: center; margin-top: 25px;">
            <button type="submit" style="margin-top: 0; flex: 1;">Update Product</button>
            <a href="{{ url_for('products') }}" 
               style="text-decoration: none; padding: 14px 20px; background: #475569; color: white; border-radius: 8px; font-weight: bold; text-align: center;">
               Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
